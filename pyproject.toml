[project]
name = "imgrate"
version = "0.1.0"
description = "Terminal UI to rate thousands of images fast and keep only the best"
readme = "README.md"
authors = [
    { name = "Willi Richert" }
]
requires-python = ">=3.12"
dependencies = [
    "pillow>=13.0.0",
    "pillow-heif>=1.8.1",
    "textual>=8.2.8",
    "textual-image>=0.14.4",
]

[project.scripts]
imgrate = "imgrate:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "TC", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
